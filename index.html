<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار أخلاقيات المهنة - 50 سؤال MCQ</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 2rem;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.4rem;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .quiz-body {
            padding: 1.5rem;
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            font-weight: bold;
        }

        .progress-container {
            background: #e2e8f0;
            border-radius: 999px;
            height: 12px;
            width: 100%;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .progress-bar {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .question-card.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
            color: var(--text);
            background: #f8fafc;
            padding: 1rem;
            border-right: 4px solid var(--primary);
            border-radius: 8px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            background: white;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 0.9rem 1.1rem;
            text-align: right;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f0fdfa;
        }

        .option-btn.correct {
            background: var(--success-bg) !important;
            border-color: var(--success) !important;
            color: #14532d !important;
            font-weight: 700;
        }

        .option-btn.incorrect {
            background: var(--danger-bg) !important;
            border-color: var(--danger) !important;
            color: #7f1d1d !important;
            font-weight: 600;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .navigation-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 1.2rem;
            gap: 0.5rem;
        }

        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 1.4rem;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        .nav-btn:disabled {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
        }

        .results-screen {
            display: none;
            text-align: center;
            padding: 2.5rem 1.5rem;
        }

        .results-screen h2 {
            font-size: 1.8rem;
            margin-bottom: 0.75rem;
            color: var(--primary);
        }

        .score-display {
            font-size: 3.2rem;
            font-weight: 800;
            margin: 1.5rem 0;
            color: var(--text);
            background: #f0fdfa;
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 16px;
            border: 2px solid var(--primary);
        }

        .result-msg {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: var(--text-light);
        }

        .restart-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 0.85rem 2.2rem;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .restart-btn:hover {
            background: #15803d;
        }

        @media (max-width: 600px) {
            body { padding: 0.5rem; }
            header h1 { font-size: 1.25rem; }
            .question-text { font-size: 1.05rem; }
            .option-btn { font-size: 0.95rem; padding: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>اختبار مادة أخلاقيات المهنة (50 سؤال)</h1>
        <p>اختبار شامل للحفظ والتعاريف والوقائع التاريخية</p>
    </header>

    <div class="quiz-body" id="quiz-container">
        <div class="quiz-info">

            <span id="score-counter">النتيجة: 0</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div id="questions-wrapper"></div>

        <div class="navigation-footer">
            <button class="nav-btn" id="prev-btn" onclick="prevQuestion()" disabled>السابق</button>
            <button class="nav-btn" id="next-btn" onclick="nextQuestion()" disabled>التالي</button>
        </div>
    </div>

    <div class="results-screen" id="results-screen">
        <h2>اكتمل الاختبار بنجاح!</h2>
        <p>لقد أنهيت جميع أسئلة مادة أخلاقيات المهنة.</p>
        <div class="score-display" id="final-score">0 / 50</div>
        <p class="result-msg" id="result-message"></p>
        <button class="restart-btn" onclick="restartQuiz()">إعادة الاختبار</button>
    </div>
</div>

    const letters = ['أ', 'ب', 'ج', 'د'];
    let currentQuestion = 0;
    let score = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    const questionsWrapper = document.getElementById('questions-wrapper');
    const questionCounter = document.getElementById('question-counter');
    const scoreCounter = document.getElementById('score-counter');
    const progressBar = document.getElementById('progress-bar');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const quizContainer = document.getElementById('quiz-container');
    const resultsScreen = document.getElementById('results-screen');
    const finalScore = document.getElementById('final-score');
    const resultMessage = document.getElementById('result-message');

    function buildQuiz() {
        questionsWrapper.innerHTML = '';
        quizData.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = `question-card ${index === 0 ? 'active' : ''}`;
            card.id = `question-${index}`;

            let optionsHtml = '';
            q.options.forEach((opt, optIndex) => {
                optionsHtml += `<button class="option-btn" onclick="selectOption(${index}, ${optIndex})"><span><strong>${letters[optIndex]})</strong></span> <span>${opt}</span></button>`;
            });

            card.innerHTML = `
                <div class="question-text">${index + 1}. ${q.question}</div>
                <div class="options-list">${optionsHtml}</div>
            `;
            questionsWrapper.appendChild(card);
        });
        updateControls();
    }

    function selectOption(qIndex, optIndex) {
        if (userAnswers[qIndex] !== null) return;

        userAnswers[qIndex] = optIndex;
        const q = quizData[qIndex];
        const card = document.getElementById(`question-${qIndex}`);
        const buttons = card.querySelectorAll('.option-btn');

        if (optIndex === q.answer) {
            buttons[optIndex].classList.add('correct');
            score++;
        } else {
            buttons[optIndex].classList.add('incorrect');
            buttons[q.answer].classList.add('correct');
        }

        buttons.forEach(btn => btn.disabled = true);
        scoreCounter.textContent = `النتيجة: ${score}`;
        nextBtn.disabled = false;
    }

    function updateControls() {
        questionCounter.textContent = `السؤال ${currentQuestion + 1} من ${quizData.length}`;
        progressBar.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;

        prevBtn.disabled = currentQuestion === 0;
        nextBtn.disabled = userAnswers[currentQuestion] === null;

        if (currentQuestion === quizData.length - 1) {
            nextBtn.textContent = 'إنهاء الاختبار';
        } else {
            nextBtn.textContent = 'التالي';
        }
    }

    function showQuestion(index) {
        document.querySelectorAll('.question-card').forEach(card => card.classList.remove('active'));
        document.getElementById(`question-${index}`).classList.add('active');
        currentQuestion = index;
        updateControls();
    }

    function nextQuestion() {
        if (currentQuestion < quizData.length - 1) {
            showQuestion(currentQuestion + 1);
        } else {
            showResults();
        }
    }

    function prevQuestion() {
        if (currentQuestion > 0) {
            showQuestion(currentQuestion - 1);
        }
    }

    function showResults() {
        quizContainer.style.display = 'none';
        resultsScreen.style.display = 'block';
        finalScore.textContent = `${score} / ${quizData.length}`;

        const percentage = (score / quizData.length) * 100;
        let msg = "";
        if (percentage >= 90) {
            msg = "ممتاز جداً! حفظك للمادة والتعاريف دقيق ومتميز.";
        } else if (percentage >= 75) {
            msg = "جيد جداً! لديك إلمام قوي بمحتوى المحاضرات.";
        } else if (percentage >= 60) {
            msg = "جيد، لكن يُنصح بمراجعة التعاريف والتواريخ لرفع درجتك.";
        } else {
            msg = "تحتاج إلى إعادة قراءة الملزمة بتركيز أكبر وحفظ التعاريف بدقة.";
        }
        resultMessage.textContent = msg;
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        userAnswers.fill(null);
        scoreCounter.textContent = `النتيجة: 0`;
        buildQuiz();
        resultsScreen.style.display = 'none';
        quizContainer.style.display = 'block';
        showQuestion(0);
    }

    window.onload = buildQuiz;
</script>
