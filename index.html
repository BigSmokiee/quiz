<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primary Health Care & Maternal Care - 100 MCQ Quiz</title>
    <style>
        :root {
            --primary: #1b3b6f;
            --secondary: #f4b41a;
            --bg: #f4f6f9;
            --text: #222222;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: var(--primary);
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: var(--secondary);
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-meta {
            display: flex;
            justify-content: space-between;
            color: #555;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .question-text {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 25px;
            font-weight: 600;
            color: #111;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }
        .option {
            background-color: #eef2f7;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            color: #1e293b;
            font-weight: 500;
            text-align: left;
        }
        .option:hover {
            background-color: #e2e8f0;
            border-color: var(--primary);
        }
        .option.selected {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .option.correct {
            background-color: #2e7d32 !important;
            color: white !important;
            border-color: #2e7d32 !important;
        }
        .option.incorrect {
            background-color: #c62828 !important;
            color: white !important;
            border-color: #c62828 !important;
        }
        .controls {
            display: flex;
            justify-content: flex-end;
        }
        button#next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button#next-btn:hover {
            background-color: #12284b;
        }
        button#next-btn:disabled {
            background-color: #9aa5b6;
            cursor: not-allowed;
        }
        .results-container {
            display: none;
            text-align: center;
        }
        .results-container h2 {
            color: var(--primary);
            font-size: 32px;
            margin-bottom: 10px;
        }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: var(--bg);
            border: 8px solid var(--secondary);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            color: var(--primary);
            margin: 30px auto;
        }
        .feedback {
            margin-top: -15px;
            margin-bottom: 20px;
            font-weight: bold;
            min-height: 24px;
            font-size: 16px;
        }
        @media (max-width: 600px) {
            .quiz-container { padding: 20px; }
            .question-text { font-size: 16px; }
            .option { padding: 12px 15px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-ui">
        <div class="header">
            <h1>Primary Health Care & Maternal Care</h1>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div class="question-meta">
            <span id="q-counter">Question 1 of 100</span>
            <span id="score-counter">Score: 0</span>
        </div>
        <div class="question-text" id="question">Loading question...</div>
        <div class="options-grid" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <div class="controls">
            <button id="next-btn" disabled>Next Question</button>
        </div>
    </div>

    <div class="quiz-container results-container" id="results-ui">

        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedOption = null;

        const uiElements = {
            quiz: document.getElementById('quiz-ui'),
            results: document.getElementById('results-ui'),
            question: document.getElementById('question'),
            options: document.getElementById('options'),
            nextBtn: document.getElementById('next-btn'),
            progress: document.getElementById('progress'),
            qCounter: document.getElementById('q-counter'),
            scoreCounter: document.getElementById('score-counter'),
            feedback: document.getElementById('feedback'),
            finalScore: document.getElementById('final-score')
        };

        function loadQuestion() {
            const q = quizData[currentQuestion];
            uiElements.question.textContent = `${currentQuestion + 1}. ${q.q}`;
            uiElements.qCounter.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
            uiElements.progress.style.width = `${((currentQuestion) / quizData.length) * 100}%`;
            uiElements.feedback.textContent = "";
            uiElements.nextBtn.disabled = true;
            selectedOption = null;

            uiElements.options.innerHTML = '';
            q.o.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.textContent = opt;
                btn.onclick = () => selectOption(index, btn);
                uiElements.options.appendChild(btn);
            });
        }

        function selectOption(index, btnElement) {
            if (selectedOption !== null) return;
            
            selectedOption = index;
            const correctIndex = quizData[currentQuestion].a;
            const options = document.querySelectorAll('.option');
            
            if (index === correctIndex) {
                btnElement.classList.add('correct');
                uiElements.feedback.textContent = "Correct!";
                uiElements.feedback.style.color = "#2e7d32";
                score++;
                uiElements.scoreCounter.textContent = `Score: ${score}`;
            } else {
                btnElement.classList.add('incorrect');
                options[correctIndex].classList.add('correct');
                uiElements.feedback.textContent = "Incorrect.";
                uiElements.feedback.style.color = "#c62828";
            }
            
            uiElements.nextBtn.disabled = false;
        }

        uiElements.nextBtn.addEventListener('click', () => {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        });

        function showResults() {
            uiElements.quiz.style.display = 'none';
            uiElements.results.style.display = 'block';
            const percentage = Math.round((score / quizData.length) * 100);
            uiElements.finalScore.textContent = `${percentage}%`;
            
            let color = "#c62828";
            if (percentage >= 80) color = "#2e7d32";
            else if (percentage >= 60) color = "var(--secondary)";
            
            uiElements.finalScore.style.borderColor = color;
            uiElements.finalScore.style.color = color;
        }

        loadQuestion();
    </script>
</body>
