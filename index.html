            question: "At what age do deciduous (temporary) teeth typically begin to erupt in a child?",
            options: ["3 months", "6 months", "9 months", "12 months"],
            answer: 1
        },
        {
            question: "At what age do permanent teeth begin to appear?",
            options: ["4 years", "6 years", "8 years", "10 years"],
            answer: 1
        },
        {
            question: "Which of the following is listed as a cause of delayed eruption of teeth in a child?",
            options: ["Excessive calcium intake", "Disease of child during dentition / Decrease Ca in food", "Mouth breathing", "Thumb sucking"],
            answer: 1
        },
        {
            question: "Which of the following is listed as a cause of deformity of teeth?",
            options: ["Mouth breathing, Thumb sucking, Tongue sucking, Accident", "Breastfeeding exclusively", "Normal calcium levels", "Early weaning"],
            answer: 0
        },
        {
            question: "When does a child typically need added nutrition to feeding (introduction of weaning foods)?",
            options: ["At 2 months", "At 4 months", "At 9 months", "At 1 year"],
            answer: 1
        },
        {
            question: "When is considered the best time for weaning?",
            options: ["First month of life", "In the second half of the first year", "At 18 months", "At 2 years"],
            answer: 1
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    const questionsWrapper = document.getElementById('questions-wrapper');
    const questionCounter = document.getElementById('question-counter');
    const scoreCounter = document.getElementById('score-counter');
    const progressBar = document.getElementById('progress-bar');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const quizContainer = document.getElementById('quiz-container');
    const resultsScreen = document.getElementById('results-screen');
    const finalScore = document.getElementById('final-score');
    const resultMessage = document.getElementById('result-message');

    function buildQuiz() {
        quizData.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = `question-card ${index === 0 ? 'active' : ''}`;
            card.id = `question-${index}`;

            let optionsHtml = '';
            q.options.forEach((opt, optIndex) => {
                optionsHtml += `<button class="option-btn" onclick="selectOption(${index}, ${optIndex})">${String.fromCharCode(65 + .5 * 0 + optIndex)}. ${opt}</button>`;
            });

            card.innerHTML = `
                <div class="question-text">${index + 1}. ${q.question}</div>
                <div class="options-list">${optionsHtml}</div>
            `;
            questionsWrapper.appendChild(card);
        });
        updateControls();
    }

    function selectOption(qIndex, optIndex) {
        if (userAnswers[qIndex] !== null) return; // Already answered

        userAnswers[qIndex] = optIndex;
        const q = quizData[qIndex];
        const card = document.getElementById(`question-${qIndex}`);
        const buttons = card.querySelectorAll('.option-btn');

        if (optIndex === q.answer) {
            buttons[optIndex].classList.add('correct');
            score++;
        } else {
            buttons[optIndex].classList.add('incorrect');
            buttons[q.answer].classList.add('correct');
        }

        // Disable all buttons for this question
        buttons.forEach(btn => btn.disabled = true);

        scoreCounter.textContent = `Score: ${score}`;
        nextBtn.disabled = false;

        // Auto advance after short delay on mobile/desktop if desired, or let user click Next
    }

    function updateControls() {
        questionCounter.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        progressBar.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;

        prevBtn.disabled = currentQuestion === 0;

        if (userAnswers[currentQuestion] !== null) {
            nextBtn.disabled = false;
        } else {
            nextBtn.disabled = true;
        }

        if (currentQuestion === quizData.length - 1) {
            nextBtn.textContent = 'Finish Quiz';
        } else {
            nextBtn.textContent = 'Next';
        }
    }

    function showQuestion(index) {
        document.querySelectorAll('.question-card').forEach(card => card.classList.remove('active'));
        document.getElementById(`question-${index}`).classList.add('active');
        currentQuestion = index;
        updateControls();
    }

    function nextQuestion() {
        if (currentQuestion < quizData.length - 1) {
            showQuestion(currentQuestion + 1);
        } else {
            showResults();
        }
    }

    function prevQuestion() {
        if (currentQuestion > 0) {
            showQuestion(currentQuestion - 1);
        }
    }

    function showResults() {
        quizContainer.style.display = 'none';
        resultsScreen.style.display = 'block';
        finalScore.textContent = `${score} / ${quizData.length}`;

        let percentage = (score / quizData.length) * 100;
        let msg = "";
        if (percentage >= 90) {
            msg = "Outstanding! Excellent mastery of the lecture notes.";
        } else if (percentage >= 75) {
            msg = "Great job! Strong understanding of the material.";
        } else if (percentage >= 60) {
            msg = "Good effort! Review the lecture notes to strengthen weak areas.";
        } else {
            msg = "Keep studying! Review the lecture texts thoroughly and try again.";
        }
        resultMessage.textContent = msg;
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        userAnswers.fill(null);
        scoreCounter.textContent = `Score: 0`;
        
        // Reset buttons and classes
        questionsWrapper.innerHTML = '';
        buildQuiz();

        resultsScreen.style.display = 'none';
        quizContainer.style.display = 'block';
        showQuestion(0);
    }

    // Initialize quiz on load
    window.onload = buildQuiz;
</script>

</body>
</html>
